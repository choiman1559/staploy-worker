syntax = "proto3";
package com.staploy;
import "protocol.proto";

enum TaskGroup {
  TASK_NONE = 0;
  TASK_MANAGE_APPS = 1;
  TASK_MANAGE_NODE = 2;
  TASK_DEPLOY = 3;
}

message ResponsePacket {
  string status = 1;
  string error_cause = 2;
  string challengeCode = 3;
  repeated bytes extra_data = 4;
}

message RequestPacket {
  TaskGroup task_group = 1;
  optional string challengeCode = 2;
  optional ProtocolProcedure protocol_procedure = 3;
  optional bytes extra_data = 4;
}