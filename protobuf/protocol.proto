syntax = "proto3";
package com.staploy;
import "app.proto";

enum ProtocolProcedure {
  PROCEDURE_SERVER_HELLO = 0;
  PROCEDURE_REQUEST_TASK = 1;
  PROCEDURE_CHECK_TASK = 2;
  PROCEDURE_CANCEL_TASK = 3;
}

enum ActionProcedure {
  PROCEDURE_NONE = 0;
  PROCEDURE_ACK = 1;
  PROCEDURE_REQUEST_WORKER_INFO = 2;
  PROCEDURE_REQUEST_APP_INFO = 3;

  PROCEDURE_PUSH_APP_BINARY = 10; // Reserved, But no used by protobuf parser (Via http file request header)
  PROCEDURE_ADD_APP_VERSION = 11;
  PROCEDURE_SET_APP_VERSION = 12;
  PROCEDURE_DELETE_APP_VERSION = 13;
  PROCEDURE_EXECUTE_SHELL = 14;
}

enum CpuArch {
  UNKNOWN = 0;
  i386 = 1;
  x86_64 = 2;
  arm = 3;
  aarch64 = 4;
  riscv32 = 5;
  riscv64 = 6;
  mipsel = 7;
  mips64el = 8;
}

message Packet {
  ProtocolProcedure procedure = 1;
  string challengeCode = 2;
  optional ActionProcedure actionProcedure = 3;
  optional string extraData = 4;
}

message ServerPacket {
  string serverUUID = 1;
  Packet packetInfo = 2;
  repeated AppInfoFetch appInfoFetch = 3;
}

message WorkerPacket {
  Packet packetInfo = 1;
  optional Result taskResult = 2;
  optional WorkerInfo workerInfo = 3;
}

message WorkerInfo {
  string workerId = 1;
  string workerName = 2;

  optional CpuArch cpuArch = 3;
  optional string binLocation = 4;
  optional sint64 cpuCoreCount = 5;
  optional sint64 memoryInBytes = 6;

  repeated InstalledAppInfo installedApp = 7;
  optional WorkerFlags workerFlags = 8;
}

message WorkerFlags {
  int64 BUFFER_SIZE = 1;
  bool USE_REMOTE_SHELL = 2;
  bool DISABLE_SYMLINK_DIR = 3;
  bool SKIP_HASH_VERIFICATION = 4;
}

message Result {
  bool taskStarted = 1;
  bool resultFinished = 2;
  bool resultSuccessful = 3;
  optional string errorMessage = 4;
}