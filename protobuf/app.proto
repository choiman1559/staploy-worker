syntax = "proto3";
package com.staploy;

message Version {
  string versionName = 1;
  repeated string entryBinaries = 2;
  repeated bytes entryBinariesHash = 3;
  optional string libcVersion = 4;
}

message AppInfo {
  string appName = 1;
  optional string appDescription = 2;
}

message AppInfoFetch {
  AppInfo app = 1;
  repeated Version appVersion = 2;
}

message InstalledAppInfo {
  AppInfo app = 1;
  optional Version currentVersion = 2;
  repeated Version availableVersion = 3;
}